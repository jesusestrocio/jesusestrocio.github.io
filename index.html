<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="modern-normalize.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flags</title>
  </head>
  <h1 id="heading-tag">Flags Quiz</h1>
  <body>
    <div id="app"></div>
    <section id="quiz-options-container">
      <button id="Africa">
        <p id="africaButtonText">Africa</p>
        <p id="africaButtonHighScore"></p>
      </button>
      <button id="Asia">Asia</button>
      <button id="Europe">Europe</button>
      <button id="North-America">North America</button>
      <button id="South-America">South America</button>
      <button id="Oceania">Oceania</button>
      <button id="All-Flags">All Flags</button>
    </section>

    <section id="display-flag-container">
      <div id="score-and-close-container">
        <div id="high-score-counter">12/30</div>
        <div id="close-button">X</div>
      </div>
      <div id="flag-name-container">
        <div id="flag-container">
        </div>
        <div id="multiple-name-container">
          <button id="selection-1"></button>
          <button id="selection-2"></button>
          <button id="selection-3"></button>
          <button id="selection-4"></button>
        </div>
        <div id="end-of-quiz-options">
          <p id="high-score">High Score : </p>
          <button id="restart-quiz">Restart Quiz</button>
          <button id="exit-to-main-menu">Exit To Main Menu</button>
        </div>
      </div>
    </section>

    <section id="cookie-pop-up" hidden="hidden" >
      <p id="cookie-policy-header">Cookie Policy</p>
      <i id="cookie-information-icon" style="font-size:24px" class="fa">&#xf05a;</i>
      <button id="accept-all-cookie">Accept All & Continue</button>
      <button id="reject-cookie">Reject</button>
    </section>
    <script type="module" src="main.js"></script>
  </body>
</html>
